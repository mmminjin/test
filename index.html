<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First GitHub Page</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #222);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      text-align: center;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      width: 320px;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      opacity: 0.8;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #00d4ff;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Hello World</h1>

    <p>
      GitHub Pages로 만든 첫 HTML 페이지입니다. ggg
    </p>

    <button onclick="sayHello()">
      클릭해 보기
    </button>
  </div>

  <script>
    function sayHello() {
      alert("안녕! HTML + JavaScript 동작 중 😎");
    }
  </script>

</body>
</html>
