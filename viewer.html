<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GrafX2 IFF Palette Cycling Viewer</title>
        <style>
            body {
                margin: 0;
                background: #111;
                color: #ddd;
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            h1 {
                margin-top: 20px;
                font-size: 20px;
            }

            #dropzone {
                width: 420px;
                height: 120px;
                border: 2px dashed #666;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 20px;
                color: #aaa;
                text-align: center;
            }

            canvas {
                image-rendering: pixelated;
                image-rendering: crisp-edges;
                border: 1px solid #444;
                margin-bottom: 20px;
            }

            .controls {
                margin-bottom: 20px;
            }

            button {
                padding: 8px 14px;
                background: #333;
                color: white;
                border: 1px solid #555;
                border-radius: 6px;
                cursor: pointer;
            }

            button:hover {
                background: #444;
            }
        </style>
    </head>
    <body>
        <h1>GrafX2 IFF(LBM) Palette Cycling Viewer</h1>

        <div id="dropzone">.LBM / .IFF 파일을 드래그하거나 클릭</div>

        <input type="file" id="fileInput" accept=".lbm,.iff,.ilbm" hidden />

        <canvas id="screen"></canvas>

        <div class="controls">
            <button id="toggleAnim">Pause</button>
        </div>

        <script>
            const dropzone = document.getElementById("dropzone");
            const fileInput = document.getElementById("fileInput");
            const canvas = document.getElementById("screen");
            const ctx = canvas.getContext("2d");
            const toggleAnim = document.getElementById("toggleAnim");

            let imageDataIndexed = null;
            let palette = [];
            let cycles = [];
            let animating = true;

            let lastTime = 0;

            function readString(view, offset, len) {
                let s = "";
                for (let i = 0; i < len; i++) {
                    s += String.fromCharCode(view.getUint8(offset + i));
                }
                return s;
            }

            function align2(n) {
                return (n + 1) & ~1;
            }

            function byteRunDecode(data) {
                let out = [];
                let i = 0;

                while (i < data.length) {
                    let n = (data[i] << 24) >> 24;
                    i++;

                    if (n >= 0 && n <= 127) {
                        for (let j = 0; j < n + 1; j++) {
                            out.push(data[i++]);
                        }
                    } else if (n >= -127 && n <= -1) {
                        let val = data[i++];
                        for (let j = 0; j < -n + 1; j++) {
                            out.push(val);
                        }
                    }
                }

                return new Uint8Array(out);
            }

            function planarToChunky(raw, width, height, planes) {
                const rowSize = ((width + 15) >> 4) << 1;
                const out = new Uint8Array(width * height);

                let src = 0;

                for (let y = 0; y < height; y++) {
                    for (let p = 0; p < planes; p++) {
                        for (let xByte = 0; xByte < rowSize; xByte++) {
                            const b = raw[src++];

                            for (let bit = 0; bit < 8; bit++) {
                                const x = xByte * 8 + bit;

                                if (x >= width) continue;

                                const v = (b >> (7 - bit)) & 1;

                                out[y * width + x] |= v << p;
                            }
                        }
                    }
                }

                return out;
            }

            function parseIFF(buffer) {
                const view = new DataView(buffer);

                if (readString(view, 0, 4) !== "FORM") {
                    throw new Error("IFF FORM 아님");
                }

                const formType = readString(view, 8, 4);

                if (formType !== "ILBM" && formType !== "PBM ") {
                    throw new Error("ILBM/PBM 파일 아님");
                }

                let offset = 12;

                let width = 0;
                let height = 0;
                let compression = 0;
                let numPlanes = 0;
                let body = null;

                palette = [];
                cycles = [];

                while (offset < view.byteLength) {
                    const chunkId = readString(view, offset, 4);
                    const chunkSize = view.getUint32(offset + 4, false);
                    const chunkDataOffset = offset + 8;

                    if (chunkId === "BMHD") {
                        width = view.getUint16(chunkDataOffset, false);
                        height = view.getUint16(chunkDataOffset + 2, false);
                        numPlanes = view.getUint8(chunkDataOffset + 8);
                        compression = view.getUint8(chunkDataOffset + 10);
                    } else if (chunkId === "CMAP") {
                        for (let i = 0; i < chunkSize; i += 3) {
                            palette.push([
                                view.getUint8(chunkDataOffset + i),
                                view.getUint8(chunkDataOffset + i + 1),
                                view.getUint8(chunkDataOffset + i + 2),
                            ]);
                        }
                    } else if (chunkId === "CRNG") {
                        const rate = view.getUint16(chunkDataOffset + 2, false);
                        const flags = view.getUint16(
                            chunkDataOffset + 4,
                            false,
                        );
                        const low = view.getUint8(chunkDataOffset + 6);
                        const high = view.getUint8(chunkDataOffset + 7);

                        cycles.push({
                            rate,
                            flags,
                            low,
                            high,
                            timer: 0,
                        });
                    } else if (chunkId === "BODY") {
                        let raw = new Uint8Array(
                            buffer,
                            chunkDataOffset,
                            chunkSize,
                        );

                        if (compression === 1) {
                            raw = byteRunDecode(raw);
                        }

                        body = raw;
                    }

                    offset += 8 + align2(chunkSize);
                }

                if (!body) {
                    throw new Error("BODY chunk 없음");
                }

                canvas.width = width;
                canvas.height = height;

                if (formType === "ILBM") {
                    imageDataIndexed = planarToChunky(
                        body,
                        width,
                        height,
                        numPlanes,
                    );
                } else {
                    imageDataIndexed = body;
                }

                render();
            }

            function render() {
                if (!imageDataIndexed) return;

                const img = ctx.createImageData(canvas.width, canvas.height);
                const data = img.data;

                for (let i = 0; i < imageDataIndexed.length; i++) {
                    const idx = imageDataIndexed[i];
                    const c = palette[idx] || [0, 0, 0];

                    const p = i * 4;

                    data[p] = c[0];
                    data[p + 1] = c[1];
                    data[p + 2] = c[2];
                    data[p + 3] = 255;
                }

                ctx.putImageData(img, 0, 0);
            }

            function cyclePalette(cycle) {
                if (cycle.high <= cycle.low) return;

                const last = palette[cycle.high];

                for (let i = cycle.high; i > cycle.low; i--) {
                    palette[i] = palette[i - 1];
                }

                palette[cycle.low] = last;
            }

            function animate(ts) {
                requestAnimationFrame(animate);

                if (!animating) return;

                const dt = ts - lastTime;
                lastTime = ts;

                let changed = false;

                for (const c of cycles) {
                    if (!(c.flags & 1)) continue;

                    const speed = Math.max(1, 273067 / (c.rate || 1));

                    c.timer += dt;

                    if (c.timer >= speed) {
                        c.timer = 0;
                        cyclePalette(c);
                        changed = true;
                    }
                }

                if (changed) {
                    render();
                }
            }

            function loadFile(file) {
                const reader = new FileReader();

                reader.onload = (e) => {
                    try {
                        parseIFF(e.target.result);
                    } catch (err) {
                        alert(err.message);
                        console.error(err);
                    }
                };

                reader.readAsArrayBuffer(file);
            }

            dropzone.addEventListener("click", () => {
                fileInput.click();
            });

            fileInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) loadFile(file);
            });

            dropzone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropzone.style.borderColor = "#aaa";
            });

            dropzone.addEventListener("dragleave", () => {
                dropzone.style.borderColor = "#666";
            });

            dropzone.addEventListener("drop", (e) => {
                e.preventDefault();
                e.stopPropagation();

                dropzone.style.borderColor = "#666";

                const file = e.dataTransfer.files[0];
                if (file) loadFile(file);
            });

            // 브라우저 기본 파일 열기 방지
            window.addEventListener("dragover", (e) => {
                e.preventDefault();
            });

            window.addEventListener("drop", (e) => {
                e.preventDefault();
            });

            toggleAnim.addEventListener("click", () => {
                animating = !animating;
                toggleAnim.textContent = animating ? "Pause" : "Play";
            });

            requestAnimationFrame(animate);
        </script>
    </body>
</html>
